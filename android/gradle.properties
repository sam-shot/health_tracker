# Give Gradle enough memory (8G is plenty for your machine)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Enable Gradle caching (reuses unchanged build outputs)
org.gradle.caching=true

# Keep a warm Gradle daemon running between builds
org.gradle.daemon=true

# Build modules in parallel (faster multi-module builds)
org.gradle.parallel=true

# Only configure necessary projects (skips unused modules)
org.gradle.configureondemand=true

# Enable incremental dexing and compilation (faster incremental builds)
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
